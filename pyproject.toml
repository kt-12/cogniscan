[project]
name = "scanmyweb"
version = "0.1.0"
description = "Drive a website with a virtual mouse, record the flow, predict brain responses with TRIBE v2, and interpret them with a local LLM."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "numpy>=1.26",
  "pillow>=10",
  "pyyaml>=6",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
scanmyweb = "cli.scanmyweb:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*", "cli*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"cli/scanmyweb.py" = ["E402", "E702"]
"cli/cdp_agent.py" = ["B023"]
