<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scanmyweb</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8590c'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f1115;--panel:#171a21;--panel2:#1d212b;--line:#2a2f3a;--text:#e6e8ee;--muted:#9aa3b5;
  --accent:#ff7a1a;--accent2:#4cc3ff;--good:#3ad29f;--bad:#ff5c6c;--warn:#ffcc4d;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}
a{color:var(--accent2);text-decoration:none}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#111;font-weight:600}
button.active{border-color:var(--accent);color:var(--accent)}
select,input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;letter-spacing:.3px}
header h1 span{color:var(--accent)}
header .grow{flex:1}
#status{font-size:12px;color:var(--muted)}
main{flex:1;display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}
#stage{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel .head{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.panel .head b{color:var(--text);font-weight:600}
.panel .body{flex:1;min-height:0;position:relative}
#flow .body{background:#000;display:flex;align-items:center;justify-content:center}
#video{max-width:100%;max-height:100%;object-fit:contain}
#stepShot{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;background:#000}
#flowCaption{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(15,17,21,.82);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;backdrop-filter:blur(4px)}
#flowCaption .lbl{font-weight:600;font-size:14px}
#flowCaption .url{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all}
#brainCanvas{width:100%;height:100%;display:block}
#brainTools{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
#brainTools button{padding:3px 8px;font-size:12px;background:rgba(29,33,43,.85)}
#brainLegend{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
#brainLegend .bar{width:120px;height:10px;border-radius:3px;background:linear-gradient(90deg,#2d6cff,#6aa0ff,#2b2f3a 50%,#ff8a3d,#ffe36a)}
#brain .body{display:flex}
#brainWrap{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden}
#roiBars{width:280px;flex:none;font-size:11px;border-left:1px solid var(--line);padding:8px 10px;overflow:auto;background:var(--panel2)}
#roiBars h4{margin:0 0 6px;font-size:11px;font-weight:500;color:var(--muted)}
#roiBars .row{display:grid;grid-template-columns:132px 1fr 40px;align-items:center;gap:6px;margin:3px 0}
#roiBars .row .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
#roiBars .track{position:relative;height:8px;background:var(--line);border-radius:4px}
#roiBars .track i{position:absolute;top:0;height:100%;border-radius:4px}
#roiBars .z{text-align:right;font-family:var(--mono)}
#bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 8px}
#bottom .panel{height:200px}
#bottom .body{padding:10px 12px;overflow:auto;font-size:13px;line-height:1.45}
#tribeText .sentence{margin-bottom:8px}
#spark{width:100%;height:56px;display:block}
#interp .headline{font-weight:600;font-size:15px;margin-bottom:4px}
#interp .ux{margin-top:8px;color:var(--warn)}
#interp .meta{margin-top:6px;font-size:11px;color:var(--muted)}
#controls{display:flex;align-items:center;gap:10px;padding:6px 16px 10px}
#dots{display:flex;gap:4px;flex-wrap:wrap}
#dots button{width:26px;height:26px;padding:0;font-size:11px;border-radius:50%}
#scrub{flex:1}
#timeLabel{font-family:var(--mono);font-size:12px;min-width:90px;text-align:right}
/* runs list */
#runs{padding:16px;overflow:auto}
#runs table{border-collapse:collapse;width:100%}
#runs th,#runs td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
#runs th{color:var(--muted);font-weight:500;font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;border:1px solid var(--line)}
.pill.done{color:var(--good);border-color:var(--good)}
.pill.processing,.pill.queued{color:var(--warn);border-color:var(--warn)}
.pill.failed{color:var(--bad);border-color:var(--bad)}
.pill.recording,.pill.recorded{color:var(--accent2);border-color:var(--accent2)}
.prog{width:160px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.hidden{display:none !important}
#overlayMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);background:rgba(15,17,21,.6);font-size:13px;text-align:center;padding:20px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
@media (max-width:1000px){#app{height:auto;min-height:100%}main{display:block}#stage{min-height:auto}#stage,#bottom{grid-template-columns:1fr}#stage .panel{height:400px;min-height:400px}#bottom .panel{height:auto;max-height:240px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>scan<span>my</span>web</h1>
    <select id="runSelect"><option value="">Runs…</option></select>
    <button id="btnRuns">All runs</button>
    <div class="grow"></div>
    <div id="status"></div>
    <a href="https://github.com/facebookresearch/tribev2" target="_blank" class="muted" style="font-size:12px">TRIBE v2</a>
  </header>

  <section id="runs" class="hidden">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <b>Runs</b><span class="muted" id="runsHint">Start a recording from the Chrome extension, or <span class="mono">scanmyweb run VIDEO</span>.</span>
    </div>
    <table><thead><tr><th>Run</th><th>Site</th><th>Mode / goal</th><th>Status</th><th>Progress</th><th>Steps</th><th></th></tr></thead><tbody id="runsBody"></tbody></table>
  </section>

  <main id="player" class="hidden">
    <div id="stage">
      <div class="panel" id="flow">
        <div class="head"><b>Website flow</b><span id="flowHead"></span><div class="grow" style="flex:1"></div>
          <button id="btnShot" title="toggle step screenshot / video">screenshot</button>
          <button id="btnPlay" title="play this step's window (space)">▶ play window</button></div>
        <div class="body">
          <video id="video" muted playsinline preload="auto"></video>
          <img id="stepShot" alt="">
          <div id="flowCaption"><div class="lbl"></div><div class="act muted"></div><div class="url"></div></div>
        </div>
      </div>
      <div class="panel" id="brain">
        <div class="head"><b>Predicted brain activity</b><span id="brainHead" class="muted">fsaverage5 · TRIBE v2</span><div style="flex:1"></div>
          <label class="muted" style="font-size:12px">threshold <input id="thr" type="range" min="0" max="0.8" step="0.02" value="0.15" style="width:90px;vertical-align:middle"></label>
          <button id="btnRoi" title="outline ROI groups">ROI outlines</button></div>
        <div class="body">
          <div id="brainWrap">
            <canvas id="brainCanvas"></canvas>
            <div id="brainTools">
              <button data-view="oblique" class="active">both</button><button data-view="lateral">left</button><button data-view="lateralR">right</button><button data-view="medial">medial</button>
              <button data-view="top">top</button><button data-view="front">front</button><button data-view="back">back</button>
              <button id="btnWindow" class="active" title="average over the step's window vs the current second">window mean</button>
            </div>
            <div id="brainLegend"><span>−</span><div class="bar"></div><span>+</span><span id="legendScale"></span></div>
            <div id="overlayMsg" class="hidden"></div>
          </div>
          <div id="roiBars"></div>
        </div>
      </div>
    </div>
    <div id="bottom">
      <div class="panel" id="tribeText"><div class="head"><b>TRIBE says</b><span class="muted">deterministic stats from the predicted fMRI</span></div>
        <div class="body"><div class="sentence"></div><svg id="spark"></svg><div class="parcels muted mono"></div></div></div>
      <div class="panel" id="interp"><div class="head"><b>Model interpretation</b><span class="muted" id="interpModel"></span></div>
        <div class="body"><div class="headline"></div><div class="text"></div><div class="ux"></div><div class="meta"></div></div></div>
    </div>
    <div id="controls">
      <button id="btnPrev" title="previous slide (←)">◀</button>
      <div id="dots"></div>
      <button id="btnNext" title="next slide (→)">▶</button>
      <input id="scrub" type="range" min="0" max="0" step="1" value="0">
      <div id="timeLabel"></div>
      <button id="btnSummary">Run summary</button>
    </div>
  </main>
</div>
<script src="/static/vendor/three.min.js"></script>
<script src="/static/viewer.js"></script>
<script src="/static/player.js"></script>
</body>
</html>
