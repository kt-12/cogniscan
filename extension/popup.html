<!doctype html>
<html><head><meta charset="utf-8">
<style>
body{width:340px;margin:0;font:13px/1.4 system-ui,sans-serif;background:#0f1115;color:#e6e8ee}
h1{font-size:14px;margin:0;padding:10px 12px;border-bottom:1px solid #2a2f3a}h1 span{color:#ff7a1a}
.b{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#9aa3b5}
input,select,textarea{font:inherit;color:#e6e8ee;background:#1d212b;border:1px solid #2a2f3a;border-radius:6px;padding:5px 8px}
textarea{resize:vertical;min-height:44px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font:inherit;color:#e6e8ee;background:#1d212b;border:1px solid #2a2f3a;border-radius:6px;padding:7px 10px;cursor:pointer}
button.primary{background:#ff7a1a;border-color:#ff7a1a;color:#111;font-weight:600}
button:disabled{opacity:.5;cursor:default}
#status{font-size:12px;color:#9aa3b5;min-height:16px;white-space:pre-wrap}
#status.err{color:#ff5c6c}
.prog{height:6px;background:#2a2f3a;border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:#ff7a1a;width:0}
a{color:#4cc3ff}
.small{font-size:11px;color:#9aa3b5}
</style></head>
<body>
<h1>scan<span>my</span>web</h1>
<div class="b">
  <label>Website URL <input id="url" placeholder="https://example.com"></label>
  <div class="row">
    <label>Mode <select id="mode"><option value="goal">Goal</option><option value="explore">Auto-explore</option></select></label>
    <label>Navigation model <select id="navModel"></select></label>
  </div>
  <label id="goalWrap">Goal <textarea id="goal" placeholder="e.g. Find the pricing page and start the sign-up form with test@example.com"></textarea></label>
  <label>Interpretation model <select id="interpModel"></select></label>
  <div class="row"><button id="start" class="primary">Start recording</button><button id="stop" disabled>Stop</button></div>
  <div class="prog"><i id="bar"></i></div>
  <div id="status"></div>
  <div class="small" id="links"><a id="open" href="http://127.0.0.1:8787/" target="_blank">Open slideshow</a> · <span id="server"></span></div>
</div>
<script src="popup.js"></script>
</body></html>
